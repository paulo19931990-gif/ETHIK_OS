<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-OS Pro</title>
    <link rel="manifest" id="dynamicManifest">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; }
        .canvas-container { border: 2px dashed #93c5fd; border-radius: 0.5rem; background-color: #ffffff; overflow: hidden; touch-action: none; position: relative; cursor: pointer; }
        .locked-input { pointer-events: none; opacity: 0.6; background-color: #e5e7eb !important; }
        .error-field { border-color: #ef4444 !important; border-width: 2px !important; background-color: #fef2f2 !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="text-gray-800">

    <div id="toast" class="fixed bottom-4 right-4 text-white px-6 py-3 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50"></div>

    <nav class="bg-gray-800 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-emerald-400">Multi-OS Pro v6.9</h1>
            <div class="flex gap-2">
                <button onclick="acionarInstalacaoApp()" class="bg-emerald-600 px-3 py-1 rounded text-sm font-bold">📲 Instalar</button>
                <button onclick="switchTab('novaOs')" class="bg-gray-700 px-3 py-1 rounded text-sm">Doc</button>
                <button onclick="switchTab('historico')" class="bg-gray-700 px-3 py-1 rounded text-sm">Histórico</button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4 mb-20">
        <div id="novaOs" class="tab-content active">
            <form id="osForm" onsubmit="event.preventDefault();">
                <div class="bg-white p-6 rounded-xl shadow-lg border-b-4 border-emerald-500 mb-6">
                    <label class="block text-sm font-bold text-gray-600 mb-1">Técnico Responsável</label>
                    <input type="text" id="tecnico" onblur="guardarConfigTecnico()" class="w-full border p-3 rounded-lg outline-none">
                </div>
                <div id="listaOrdensServico" class="space-y-6"></div>
                <button type="button" id="btnAddOs" onclick="adicionarBlocoOS()" class="w-full py-4 border-2 border-dashed border-gray-300 rounded-lg font-bold text-gray-500 hover:bg-gray-50">+ Adicionar Nova OS</button>
                <div class="flex gap-4 mt-8 sticky bottom-4 z-30">
                    <button type="button" id="btnSalvar" onclick="salvarDocumento(false)" class="flex-1 bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg">💾 SALVAR</button>
                    <button type="button" id="btnGerarPdf" onclick="gerarPDFConsolidado()" class="flex-1 bg-gray-800 text-white font-bold py-4 rounded-xl shadow-lg">📄 GERAR PDF</button>
                </div>
            </form>
        </div>

        <div id="historico" class="tab-content">
            <div class="bg-white p-6 rounded-xl shadow-md mb-6">
                <h2 class="text-xl font-bold text-gray-700 mb-4">Uso de Armazenamento</h2>
                <div class="flex justify-between text-sm mb-1">
                    <span id="storage-text" class="font-semibold text-gray-600">Calculando...</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden border">
                    <div id="storage-bar" class="bg-emerald-600 h-4 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            <div id="historicoList" class="space-y-3"></div>
        </div>
    </div>

    <!-- Modal PDF -->
    <div id="modalPreviewPDF" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg w-full max-w-5xl h-[95vh] flex flex-col shadow-2xl relative">
            <div class="flex justify-between p-4 border-b bg-gray-50"><h3 class="font-bold">Visualizador</h3><button onclick="document.getElementById('modalPreviewPDF').classList.add('hidden')" class="px-3 bg-gray-800 text-white rounded">Fechar</button></div>
            <div id="pdfRenderContainer" class="flex-1 overflow-auto bg-gray-300 flex flex-col items-center p-4">
                <div id="pdfPagesWrapper" class="origin-top-left transition-transform"></div>
            </div>
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex bg-gray-900/90 text-white rounded-full px-4 py-2 gap-4">
                <button onclick="zoomOutPdf()" class="w-10 h-10 bg-gray-800 rounded-full">−</button>
                <span id="zoomText" class="w-12 text-center pt-2 font-bold">100%</span>
                <button onclick="zoomInPdf()" class="w-10 h-10 bg-gray-800 rounded-full">+</button>
            </div>
        </div>
    </div>

    <script>
        localforage.config({ name: 'MultiOSProDB' });
        let currentZoom = 1, padTecnico, padCliente, contadorOS = 0, deferredPrompt = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await carregarConfig();
            injetarManifestDinamico();
            adicionarBlocoOS();
        });

        // Configs e UI
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'historico') { atualizarIndicadorArmazenamento(); carregarHistorico(); }
        }

        async function guardarConfigTecnico() { await localforage.setItem('pref_tecnico', document.getElementById('tecnico').value); }
        async function carregarConfig() { const t = await localforage.getItem('pref_tecnico'); document.getElementById('tecnico').value = t || "Paulo Henrique Gomes Maria"; }
        
        function mostrarToast(msg, err=false) {
            const t = document.getElementById('toast'); t.textContent = msg;
            t.className = `fixed bottom-4 right-4 text-white px-6 py-3 rounded shadow-lg z-50 transition-opacity ${err ? 'bg-red-600' : 'bg-gray-800'}`;
            setTimeout(() => t.classList.add('opacity-0'), 3000); t.classList.remove('opacity-0');
        }

        // Armazenamento
        async function atualizarIndicadorArmazenamento() {
            if (navigator.storage && navigator.storage.estimate) {
                const { usage, quota } = await navigator.storage.estimate();
                const p = (usage / quota) * 100;
                document.getElementById('storage-text').textContent = `${(usage/1024/1024).toFixed(1)} MB usados de ${(quota/1024/1024/1024).toFixed(2)} GB`;
                document.getElementById('storage-bar').style.width = `${p}%`;
                document.getElementById('storage-bar').className = `h-4 transition-all ${p > 80 ? 'bg-red-500' : 'bg-emerald-600'}`;
            }
        }

        // PWA
        function gerarIconeOSVerdeBase64() {
             const c = document.createElement('canvas'); c.width=512; c.height=512; const ctx = c.getContext('2d');
             ctx.fillStyle='#1f2937'; ctx.fillRect(0,0,512,512); ctx.strokeStyle='#10b981'; ctx.lineWidth=28; ctx.strokeRect(32,32,448,448);
             ctx.fillStyle='#ffffff'; ctx.font='bold 180px Arial'; ctx.textAlign='center'; ctx.fillText('OS', 256, 256); return c.toDataURL('image/png');
        }
        function injetarManifestDinamico() {
            const m = { name: "Multi-OS Pro", short_name: "Multi-OS", start_url: "./", display: "standalone", background_color: "#1f2937", theme_color: "#10b981", icons: [{ src: gerarIconeOSVerdeBase64(), sizes: "512x512", type: "image/png" }] };
            document.getElementById('dynamicManifest').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(m)], {type: 'application/json'})));
        }
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
        function acionarInstalacaoApp() { if (deferredPrompt) deferredPrompt.prompt(); else alert("Use o menu do navegador -> 'Adicionar ao Ecrã Principal'"); }

        // PDF Zoom
        function atualizarZoomPdf() {
            document.querySelectorAll('#pdfPagesWrapper canvas').forEach(c => c.style.width = (window.innerWidth > 600 ? 768 * currentZoom : 100 * currentZoom) + 'px');
            document.getElementById('zoomText').innerText = Math.round(currentZoom * 100) + '%';
        }
        function zoomInPdf() { currentZoom = Math.min(currentZoom + 0.25, 4); atualizarZoomPdf(); }
        function zoomOutPdf() { currentZoom = Math.max(currentZoom - 0.25, 1); atualizarZoomPdf(); }

        // Placeholder lógico para as suas funções de OS
        function adicionarBlocoOS() { /* Implemente aqui a sua lógica de criar o bloco */ }
        function recolherDadosDoFormulario() { /* Implemente aqui a sua lógica de recolha */ }
        function validarCamposObrigatorios() { return true; }
        async function obterHistoricoSalvo() { return (await localforage.getItem('historico_os')) || []; }
        async function gravarHistoricoSalvo(h) { try { await localforage.setItem('historico_os', h); return true; } catch(e) { return false; } }
        async function carregarHistorico() { /* Implemente aqui a lógica de carregar o histórico */ }
        async function salvarDocumento(s) { /* Implemente aqui a lógica de salvar com try-catch */ }
        async function gerarPDFConsolidado() { /* Implemente aqui a lógica de PDF */ }

    </script>
</body>
</html>
